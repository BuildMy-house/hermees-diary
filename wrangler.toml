# Cloudflare Pages configuration
name = "hermees-diary"
type = "javascript"
compatibility_date = "2026-08-28"

# Build output for Pages
[build]
command = "npm run build"
cwd = "./"
root_dir = "dist"

[env.production]
name = "hermees-prod"
routes = [
  { pattern = "hermees.yourdomain.com/*", zone_name = "yourdomain.com" }
]
